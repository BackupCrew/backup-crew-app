workflows:
  android-debug:
    name: Android test build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install packages
        script: npm ci
      - name: Copy web files into Android
        script: npx cap sync android
      - name: Build the Android app
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk