workflows:
  android-debug:
    name: Android test build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install packages
        script: npm ci
      - name: Copy web files into Android
        script: npx cap sync android
      - name: Build the Android app
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  android-release:
    name: Android release (Google Play)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      android_signing:
        - backup_crew_upload
      node: 22
      java: 21
    scripts:
      - name: Install packages
        script: npm ci
      - name: Copy web files into Android
        script: npx cap sync android
      - name: Set version number
        script: |
          cd android
          sed -i '' "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" app/build.gradle
      - name: Build release bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Sign release bundle
        script: |
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -keypass "$CM_KEY_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$CM_KEY_ALIAS"
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: backup_crew_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cheyennegaller.backupcrew
      node: 22
      xcode: latest
    scripts:
      - name: Install packages
        script: npm ci
      - name: Copy web files into iOS
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build the iPhone app
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

